name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: npm install --ignore-scripts
      # The PDF content-coverage check (tests/pdf-content-check.test.mjs) is an
      # end-to-end Chromium render, so it is the one test that cannot run
      # without a browser. It guards a regression that shipped twice — a
      # clipped contact line — and without this step it would skip in CI
      # forever, which is how a guard becomes decoration.
      #
      # Tradeoff: ~170 MB and ~20s per PR run. Accepted, and scoped: only
      # chromium (not all browsers), cached across runs by key on the
      # Playwright version, and --with-deps is omitted since ubuntu-latest
      # already carries the shared libraries the headless build needs. The
      # cheaper alternative — leaving --ignore-scripts alone and letting the
      # check skip — is what this PR exists to fix.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package.json').dependencies.playwright")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: node test-all.mjs --quick
      - name: Go dashboard tests
        run: go test ./...
        working-directory: dashboard
