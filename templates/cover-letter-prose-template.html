<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover Letter - {{NAME}}</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    /* Disable fi/fl/ffi ligatures. Headless Chromium substitutes these letter
       pairs with the Unicode glyphs U+FB01/FB02/FB03 at PDF layout time, and PDF
       text extractors (what ATS systems read) decode them back to those
       codepoints, so "verification" becomes "veriﬁcation" and a literal keyword
       search misses it. Required ligatures (rlig) stay on. */
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    /* 9.5pt/1.32 matches the letter approved and shipped to White & Case on
       2026-07-15. The payload template's looser 10pt/1.4 spilled the same prose
       onto a second page: it packs body copy into a bulleted <ul>, which buys
       vertical space this template does not have. Prose mode renders every
       audited paragraph as a paragraph, so the density has to come from here.
       Length is enforced by the --max-pages guard, not by shrinking type. */
    font-family: Helvetica, Arial, sans-serif;
    font-size: 9.5pt;
    line-height: 1.32;
    color: #1a1a1a;
    background: #ffffff;
    /* Disable ligatures here as well; see the * rule above. */
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }

  .name {
    font-weight: 700;
    font-size: 14pt;
    margin-bottom: 3pt;
  }

  .contact, .credentials {
    font-size: 9pt;
    color: #666666;
    line-height: 1.3;
    margin-bottom: 2pt;
  }

  .contact a, .credentials a, .footnotes a {
    color: #1a56a0;
    text-decoration: none;
  }

  .divider {
    border: none;
    border-top: 0.5pt solid #cccccc;
    margin: 5pt 0 6pt;
  }

  .role-title {
    font-weight: 700;
    font-size: 11pt;
    margin-bottom: 2pt;
  }

  .dateline {
    font-size: 9pt;
    color: #666666;
    margin-bottom: 8pt;
  }

  .greeting {
    margin-bottom: 6pt;
  }

  p {
    margin-bottom: 6.5pt;
    text-align: left;
  }

  .achievements {
    list-style: none;
    margin-bottom: 6.5pt;
  }

  /* Hanging indent, NOT position:relative + position:absolute. A positioned
     list item is painted in a later stacking phase, so Chrome emits its text
     after the rest of the body in the PDF content stream. pdfjs reads that
     stream in order, and assertPdfContentCoverage() needs the body text
     contiguous, so the bullets extracted out of order failed the check and
     reported the letter as clipped past the printable edge when nothing was
     clipped. Keeping the marker in normal flow preserves document order. */
  .achievements li {
    margin-bottom: 4pt;
    padding-left: 14pt;
    text-indent: -14pt;
  }

  .achievements li::before {
    content: "\2022";
    display: inline-block;
    width: 14pt;
    text-indent: 0;
  }

  .signoff {
    margin-top: 10pt;
  }

  .signoff .close {
    margin-bottom: 2pt;
  }

  .signoff .signature {
    font-weight: 600;
  }

  .footnotes {
    margin-top: 10pt;
    padding-top: 4pt;
    border-top: 0.5pt solid #cccccc;
  }

  .footnotes p {
    font-size: 8pt;
    color: #888888;
    line-height: 1.3;
    margin-bottom: 3pt;
  }
</style>
</head>
<body>
  <div class="name">{{NAME}}</div>
  <div class="contact">{{CONTACT_LINE}}</div>
  {{CREDENTIALS_BLOCK}}
  <hr class="divider">

  <div class="role-title">Cover Letter: {{ROLE_TITLE}}</div>
  <div class="dateline">{{DATELINE}}</div>

  {{GREETING_BLOCK}}
{{BODY_BLOCK}}
  {{SIGNOFF_BLOCK}}
  {{FOOTNOTES_BLOCK}}
</body>
</html>
