<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Synthetic RTL fixture — PDF content coverage scope limit</title>
<style>
  /* Entirely synthetic fixture — placeholder Arabic prose, no real person's
     data. Models the RTL regime templates/cv-template.html can produce via its
     html[lang="ar"] { direction: rtl } rules.

     This fixture exists to pin the coverage check's KNOWN SCOPE LIMIT: a PDF
     text layer stores Arabic in bidi VISUAL order, while innerText is logical
     order, so the two cannot be compared by substring even though no content
     is missing (measured: identical character multisets once NFKC folds the
     Presentation Forms back to base letters — the residual difference is pure
     reordering). The check must therefore report a VISIBLE SKIP here rather
     than a false failure, and must never print an unqualified success. */
  html[lang="ar"] body {
    direction: rtl;
    text-align: right;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    font-size: 12px;
  }
</style>
</head>
<body>
  <h1>مستند اختباري تجريبي</h1>
  <p>هذا نص بديل غير حقيقي يستخدم لأغراض الاختبار فقط ولا يمثل أي شخص حقيقي.</p>
  <p>خبرة في Python و JavaScript منذ 2019 مع فريق من 12 مهندسا.</p>
  <p>القسم الثاني من المستند التجريبي يحتوي على نص بديل إضافي للاختبار.</p>
  <div class="footer">نص تذييل تجريبي - test@example.com</div>
</body>
</html>
